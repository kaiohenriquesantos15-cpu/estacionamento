<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estacionamento</title>
    <style>
        :root {
            --white: #ffffff;
            --bg: #f7f8fa;
            --border: #e8eaed;
            --border-strong: #d0d4dc;
            --text: #1a1d23;
            --text-secondary: #5c6370;
            --text-muted: #8b92a0;
            --accent: #0d9488;
            --accent-hover: #0f766e;
            --accent-soft: #ccfbf1;
            --success: #059669;
            --success-bg: #ecfdf5;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --preferencial: #ea580c;
            --preferencial-bg: #fff7ed;
            --idoso: #7c3aed;
            --idoso-bg: #f5f3ff;
            --radius: 10px;
            --radius-sm: 6px;
            --shadow: 0 1px 3px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .app {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--white);
            min-height: 100vh;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.06);
        }

        .topbar {
            padding: 0 28px;
            display: flex;
            align-items: center;
            height: 64px;
            border-bottom: 1px solid var(--border);
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            color: white;
        }

        .stats-strip {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-bottom: 1px solid var(--border);
        }

        .stat-item {
            padding: 16px 20px;
            border-right: 1px solid var(--border);
        }

        .stat-item .label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-item .value {
            font-size: 1.4rem;
            font-weight: 700;
        }

        .tabs-nav {
            display: flex;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: #f0fdfa;
        }

        .main {
            padding: 28px;
            background: var(--bg);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 20px;
        }

        .card-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            background: #fafbfc;
        }

        .card-body {
            padding: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;
            padding: 9px 12px;
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
        }

        button {
            padding: 9px 16px;
            border-radius: var(--radius-sm);
            font-weight: 600;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .message {
            padding: 11px 14px;
            border-radius: var(--radius-sm);
            margin-top: 12px;
            display: none;
            font-size: 0.85rem;
        }

        .message.success {
            background: var(--success-bg);
            color: #065f46;
            display: block;
        }

        .message.error {
            background: var(--danger-bg);
            color: #991b1b;
            display: block;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 14px;
            border-bottom: 1px solid var(--border);
            font-size: 0.82rem;
            text-align: left;
        }

        th {
            background: #fafbfc;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.68rem;
        }

        .parking-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-secondary);
            margin: 20px 0 10px 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .parking-spots {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .spot {
            width: 90px;
            padding: 12px 8px;
            text-align: center;
            border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-strong);
            background: var(--white);
            font-size: 0.85rem;
        }

        .spot.available {
            background: var(--success-bg);
            border-color: #6ee7b7;
        }

        .spot.occupied {
            background: var(--danger-bg);
            border-color: #fca5a5;
        }

        .spot.preferencial {
            background: var(--preferencial-bg);
            border-color: #fdba74;
        }

        .spot.idoso {
            background: var(--idoso-bg);
            border-color: #c4b5fd;
        }

        .spot.occupied.preferencial,
        .spot.occupied.idoso {
            background: var(--danger-bg);
            border-color: #fca5a5;
        }

        .spot-number {
            font-weight: 700;
            font-size: 0.9rem;
        }

        .spot-status {
            font-size: 0.7rem;
            color: var(--text-muted);
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="topbar">
            <div class="brand-icon">🚗</div>
            <h1>Sistema de Estacionamento</h1>
        </header>

        <div class="stats-strip" id="stats"></div>

        <nav class="tabs-nav">
            <button class="tab-btn active" onclick="showTab('vagas', this)">🅿️ Vagas</button>
            <button class="tab-btn" onclick="showTab('entrada', this)">✅ Entrada</button>
            <button class="tab-btn" onclick="showTab('saida', this)">❌ Saída</button>
            <button class="tab-btn" onclick="showTab('clientes', this)">👥 Clientes</button>
            <button class="tab-btn" onclick="showTab('veiculos', this)">🚙 Veículos</button>
        </nav>

        <main class="main">
            <div id="vagas" class="tab-content active">
                <h2>Mapa de Vagas</h2>
                <div id="parkingSpotsContainer"></div>
            </div>

            <div id="entrada" class="tab-content">
                <h2>Registrar Entrada</h2>
                <div class="card">
                    <div class="card-body">
                        <div class="form-group">
                            <label>Placa do Veículo *</label>
                            <input type="text" id="placaEntrada" placeholder="ABC1D23">
                        </div>
                        <div class="form-group">
                            <label>Escolha a Vaga *</label>
                            <select id="vagaEntrada"></select>
                        </div>
                        <button class="btn-success" onclick="registrarEntrada()">✅ Confirmar Entrada</button>
                        <div id="messageEntrada" class="message"></div>
                    </div>
                </div>
            </div>

            <div id="saida" class="tab-content">
                <h2>Registrar Saída</h2>
                <div class="card">
                    <div class="card-body">
                        <div class="form-group">
                            <label>Placa do Veículo *</label>
                            <div style="display: flex; gap: 10px;">
                                <input type="text" id="placaSaida" placeholder="ABC1D23"
                                    onkeypress="if(event.key==='Enter') buscarSaida()">
                                <button class="btn-primary" onclick="buscarSaida()">🔍 Buscar</button>
                            </div>
                        </div>

                        <div id="infoSaida"
                            style="display:none; margin-top: 15px; padding: 15px; background: #f0fdfa; border-radius: 8px; border: 1px solid var(--accent-soft);">
                            <p><strong>Vaga Ocupada:</strong> <span id="outVaga"></span></p>
                            <p><strong>Horário de Entrada:</strong> <span id="outEntrada"></span></p>
                            <p><strong>Tempo de Permanência:</strong> <span id="outTempo"></span></p>
                            <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ccc;">
                            <div class="form-group">
                                <label>Valor Total a Pagar (R$)</label>
                                <input type="number" id="valorSaida" step="0.01">
                            </div>
                            <button class="btn-danger" onclick="confirmarSaida()">❌ Confirmar Saída e Pagamento</button>
                        </div>
                        <div id="messageSaida" class="message"></div>
                    </div>
                </div>
            </div>

            <div id="clientes" class="tab-content">
                <h2>Clientes</h2>
                <div class="card">
                    <div class="card-body">
                        <div class="form-group"><label>Nome</label><input type="text" id="clienteNome"></div>
                        <div class="form-group"><label>CPF (Único)</label><input type="text" id="clienteDocumento"
                                placeholder="000.000.000-00"></div>
                        <div class="form-group"><label>Telefone</label><input type="text" id="clienteTelefone"
                                placeholder="(00) 00000-0000"></div>
                        <button class="btn-success" onclick="cadastrarCliente()">Salvar Cliente</button>
                        <div id="messageCliente" class="message"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Clientes Cadastrados</div>
                    <div class="card-body table-wrap">
                        <table id="tabelaClientes">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>CPF</th>
                                    <th>Telefone</th>
                                    <th>Data Cadastro</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div id="veiculos" class="tab-content">
                <h2>Veículos</h2>
                <div class="card">
                    <div class="card-body">
                        <div class="form-group"><label>Placa</label><input type="text" id="veiculoPlaca"></div>
                        <div class="form-group"><label>Modelo</label><input type="text" id="veiculoModelo"></div>
                        <div class="form-group"><label>Marca</label><input type="text" id="veiculoMarca"></div>
                        <div class="form-group"><label>Cor</label><input type="text" id="veiculoCor"></div>
                        <div class="form-group"><label>Cliente</label><select id="veiculoCliente"></select></div>
                        <button class="btn-success" onclick="cadastrarVeiculo()">Salvar Veículo</button>
                        <div id="messageVeiculo" class="message"></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Veículos Cadastrados</div>
                    <div class="card-body table-wrap">
                        <table id="tabelaVeiculos">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Placa</th>
                                    <th>Modelo</th>
                                    <th>Marca</th>
                                    <th>Cor</th>
                                    <th>Dono</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API = '/api';
        let clients = [], vehicles = [], prices = [], ocupadas = [];

        const VAGAS = [];
        for (let i = 1; i <= 4; i++) VAGAS.push({ num: i, tipo: 'preferencial', icone: '⭐' });
        for (let i = 5; i <= 7; i++) VAGAS.push({ num: i, tipo: 'idoso', icone: '👴' });
        for (let i = 8; i <= 30; i++) VAGAS.push({ num: i, tipo: 'normal', icone: '🅿️' });

        async function carregarDados() {
            try {
                clients = await (await fetch(`${API}/clientes`)).json();
                vehicles = await (await fetch(`${API}/veiculos`)).json();
                prices = await (await fetch(`${API}/precos`)).json();
                ocupadas = await (await fetch(`${API}/estadias/abertas`)).json();

                renderVagas();
                updateStats();
                preencherSelects();
                renderTabelas();
            } catch (e) {
                console.error(e);
                alert("Erro ao conectar com o servidor.");
            }
        }

        function showTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function mostrarMensagem(id, msg, tipo) {
            const el = document.getElementById(id);
            el.textContent = msg; el.className = `message ${tipo}`;
            setTimeout(() => el.style.display = 'none', 4000);
        }

        function preencherSelects() {
            const selectVaga = document.getElementById('vagaEntrada');
            let htmlVagas = '<option value="">Selecione uma vaga livre...</option>';
            VAGAS.forEach(v => {
                if (!ocupadas.some(o => o.vaga === v.num)) {
                    htmlVagas += `<option value="${v.num}">${v.icone} Vaga ${v.num} (${v.tipo})</option>`;
                }
            });
            selectVaga.innerHTML = htmlVagas;
            document.getElementById('veiculoCliente').innerHTML = clients.map(c =>
                `<option value="${c.id}">ID ${c.id} - ${c.nome}</option>`
            ).join('');
        }

        function renderTabelas() {
            document.querySelector('#tabelaClientes tbody').innerHTML = clients.map(c => {
                let dataFormatada = '-';
                if (c.data_cadastro) {
                    dataFormatada = new Date(c.data_cadastro.replace(' ', 'T')).toLocaleString('pt-BR');
                }
                return `<tr><td>${c.id}</td><td>${c.nome}</td><td>${c.cpf || '-'}</td><td>${c.fone || '-'}</td><td>${dataFormatada}</td></tr>`;
            }).join('');

            document.querySelector('#tabelaVeiculos tbody').innerHTML = vehicles.map(v =>
                `<tr><td>${v.id}</td><td>${v.placa}</td><td>${v.modelo}</td><td>${v.marca || '-'}</td><td>${v.cor || '-'}</td><td>${v.cliente_nome}</td></tr>`
            ).join('');
        }

        async function registrarEntrada() {
            const placa = document.getElementById('placaEntrada').value.toUpperCase();
            const vaga = parseInt(document.getElementById('vagaEntrada').value);
            const veiculo = vehicles.find(v => v.placa === placa);

            if (!veiculo) return mostrarMensagem('messageEntrada', 'Veículo não cadastrado!', 'error');
            if (ocupadas.find(e => e.placa === placa)) return mostrarMensagem('messageEntrada', 'Veículo já está no estacionamento!', 'error');
            if (!vaga) return mostrarMensagem('messageEntrada', 'Selecione uma vaga!', 'error');

            const res = await fetch(`${API}/estadias`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ veiculo_id: veiculo.id, vaga: vaga })
            });
            const data = await res.json();

            if (res.ok) {
                mostrarMensagem('messageEntrada', `Entrada registrada na vaga ${vaga}!`, 'success');
                document.getElementById('placaEntrada').value = '';
                carregarDados();
            } else {
                mostrarMensagem('messageEntrada', data.error || 'Erro.', 'error');
            }
        }

        let dadosSaidaAtual = null;

        async function buscarSaida() {
            const placa = document.getElementById('placaSaida').value.trim().toUpperCase();
            if (!placa) return mostrarMensagem('messageSaida', 'Digite a placa.', 'error');

            const res = await fetch(`${API}/estadias/saida/${placa}`);
            if (!res.ok) {
                document.getElementById('infoSaida').style.display = 'none';
                return mostrarMensagem('messageSaida', 'Veículo não encontrado no pátio.', 'error');
            }

            dadosSaidaAtual = await res.json();
            const entrada = new Date(dadosSaidaAtual.horario_entrada.replace(' ', 'T'));
            const diffHoras = Math.max(1, Math.ceil((new Date() - entrada) / (1000 * 60 * 60)));
            const precoHora = prices.find(p => p.tipo_veiculo === 'CARRO')?.valor_hora || 8.00;

            document.getElementById('outVaga').innerText = `Vaga ${dadosSaidaAtual.vaga || 'N/A'}`;
            document.getElementById('outEntrada').innerText = entrada.toLocaleString('pt-BR');
            document.getElementById('outTempo').innerText = `${diffHoras} hora(s)`;
            document.getElementById('valorSaida').value = (diffHoras * precoHora).toFixed(2);

            document.getElementById('infoSaida').style.display = 'block';
            document.getElementById('messageSaida').style.display = 'none';
        }

        async function confirmarSaida() {
            if (!dadosSaidaAtual) return;
            const valorPago = parseFloat(document.getElementById('valorSaida').value) || 0;

            await fetch(`${API}/estadias/${dadosSaidaAtual.id}/saida`, {
                method: 'PUT', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valor_total: valorPago })
            });
            await fetch(`${API}/pagamentos`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estadia_id: dadosSaidaAtual.id, forma_pagamento: 'PIX', valor_pago: valorPago })
            });

            mostrarMensagem('messageSaida', `Saída OK! R$ ${valorPago.toFixed(2)}.`, 'success');
            document.getElementById('placaSaida').value = '';
            document.getElementById('infoSaida').style.display = 'none';
            dadosSaidaAtual = null;
            carregarDados();
        }

        async function cadastrarCliente() {
            const nome = document.getElementById('clienteNome').value;
            const cpf = document.getElementById('clienteDocumento').value;
            const fone = document.getElementById('clienteTelefone').value;

            if (!nome || !cpf) return mostrarMensagem('messageCliente', 'Preencha nome e CPF!', 'error');

            const res = await fetch(`${API}/clientes`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, cpf, fone })
            });
            const data = await res.json();

            if (res.ok) {
                mostrarMensagem('messageCliente', 'Cliente salvo!', 'success');
                document.getElementById('clienteNome').value = '';
                document.getElementById('clienteDocumento').value = '';
                document.getElementById('clienteTelefone').value = '';
                carregarDados();
            } else {
                mostrarMensagem('messageCliente', data.error || 'Erro.', 'error');
            }
        }

        async function cadastrarVeiculo() {
            const placa = document.getElementById('veiculoPlaca').value.toUpperCase();
            const modelo = document.getElementById('veiculoModelo').value;
            const marca = document.getElementById('veiculoMarca').value;
            const cor = document.getElementById('veiculoCor').value;
            const cliente_id = document.getElementById('veiculoCliente').value;

            if (!placa || !modelo || !cliente_id) return mostrarMensagem('messageVeiculo', 'Preencha placa, modelo e cliente!', 'error');

            const res = await fetch(`${API}/veiculos`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ placa, modelo, marca, cor, cliente_id })
            });
            if (res.ok) {
                mostrarMensagem('messageVeiculo', 'Veículo salvo!', 'success');
                document.getElementById('veiculoPlaca').value = '';
                document.getElementById('veiculoModelo').value = '';
                document.getElementById('veiculoMarca').value = '';
                document.getElementById('veiculoCor').value = '';
                carregarDados();
            } else {
                mostrarMensagem('messageVeiculo', 'Erro: Placa já existe?', 'error');
            }
        }

        function renderVagas() {
            let html = '';
            const tipos = [
                { id: 'preferencial', titulo: '⭐ Preferenciais' },
                { id: 'idoso', titulo: '👴 Idoso' },
                { id: 'normal', titulo: '🅿️ Normais' }
            ];
            tipos.forEach(t => {
                html += `<div class="parking-title">${t.titulo}</div><div class="parking-spots">`;
                VAGAS.filter(v => v.tipo === t.id).forEach(v => {
                    const ocupada = ocupadas.find(o => o.vaga === v.num);
                    html += `<div class="spot ${ocupada ? 'occupied' : 'available'} ${v.tipo}">
                        <div class="spot-number">${v.icone} ${v.num}</div>
                        <div class="spot-status">${ocupada ? ocupada.placa : 'Livre'}</div>
                    </div>`;
                });
                html += `</div>`;
            });
            document.getElementById('parkingSpotsContainer').innerHTML = html;
        }

        function updateStats() {
            document.getElementById('stats').innerHTML = `
                <div class="stat-item"><div class="label">Vagas Totais</div><div class="value">30</div></div>
                <div class="stat-item"><div class="label">Ocupadas</div><div class="value" style="color:red">${ocupadas.length}</div></div>
                <div class="stat-item"><div class="label">Clientes</div><div class="value">${clients.length}</div></div>
                <div class="stat-item"><div class="label">Veículos</div><div class="value">${vehicles.length}</div></div>
            `;
        }

        carregarDados();
    </script>
</body>

</html>
